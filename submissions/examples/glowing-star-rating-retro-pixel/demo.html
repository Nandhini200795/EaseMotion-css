
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Glowing Star Rating</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="demo-shell">

    <section class="rating-card" aria-labelledby="rating-title">

      <p class="eyebrow">
        EASEMOTION / COMPONENT DEMO
      </p>

      <h1 id="rating-title">
        Rate your experience
      </h1>

      <p class="description">
        A glowing retro-pixel star rating built with pure CSS.
      </p>

      <div class="rating" role="group" aria-label="Star rating">

        <input
          class="rating__input"
          type="radio"
          id="star-5"
          name="rating"
          value="5"
        >

        <label
          class="rating__star"
          for="star-5"
          aria-label="5 out of 5 stars"
        >★</label>


        <input
          class="rating__input"
          type="radio"
          id="star-4"
          name="rating"
          value="4"
        >

        <label
          class="rating__star"
          for="star-4"
          aria-label="4 out of 5 stars"
        >★</label>


        <input
          class="rating__input"
          type="radio"
          id="star-3"
          name="rating"
          value="3"
        >

        <label
          class="rating__star"
          for="star-3"
          aria-label="3 out of 5 stars"
        >★</label>


        <input
          class="rating__input"
          type="radio"
          id="star-2"
          name="rating"
          value="2"
        >

        <label
          class="rating__star"
          for="star-2"
          aria-label="2 out of 5 stars"
        >★</label>


        <input
          class="rating__input"
          type="radio"
          id="star-1"
          name="rating"
          value="1"
        >

        <label
          class="rating__star"
          for="star-1"
          aria-label="1 out of 5 stars"
        >★</label>

      </div>

      <p class="rating-hint">
        Use Tab and arrow keys to navigate.
        Select a star to rate.
      </p>

    </section>

  </main>

</body>
</html>
